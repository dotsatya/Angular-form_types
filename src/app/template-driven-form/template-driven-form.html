<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <!-- Title -->
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Template-driven form</h1>

    <p class="text-center text-gray-500 mb-8">Please enter your details to login</p>

    <form action="" #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" class="space-y-5">
      <!-- Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2"> Name </label>
        <input
          type="text"
          name="name"
          ngModel
          placeholder="Enter your name"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
        />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2"> Email </label>
        <input
          type="email"
          name="email"
          ngModel
          placeholder="Enter your email"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2"> Password </label>
        <input
          type="password"
          name="password"
          ngModel
          placeholder="Enter your password"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
        />
      </div>

      <!-- Button -->
      <!-- // [disabled]="loginForm.invalid" for validate the form to submit -->
      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 active:scale-[0.98] transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Login
      </button>
    </form>

    <p>name: {{ loginForm.value.name }}</p>

    <p>name: {{ showUserDetails.name }}</p>
    <p>email: {{ showUserDetails.email }}</p>
  </div>
</div>

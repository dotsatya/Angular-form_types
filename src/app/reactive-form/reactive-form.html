<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <!-- Title -->
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Login</h1>

    <p class="text-center text-gray-500 mb-8">Please enter your details to login</p>

    <form action="" method="get" class="space-y-5">
      <!-- Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2"> Name </label>
        <input
          type="text"
          name="name"
          [formControl]="name"
          placeholder="Enter your name"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
        />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2"> Email </label>
        <input
          type="email"
          name="email"
          [formControl]="email"
          placeholder="Enter your email"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2"> Password </label>
        <input
          type="password"
          name="password"
          [formControl]="password"
          placeholder="Enter your password"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
        />
      </div>

      <!-- Button -->
      <!-- <button
        (click)="onSubmit()"
        type="button"
        class="w-full bg-blue-600 text-white py-3 rounded-lg
               font-semibold hover:bg-blue-700
               active:scale-[0.98] transition"
      >
        Login
      </button> -->
      <button
        (click)="onSubmit($event)"
        type="submit"
        class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 active:scale-[0.98] transition"
      >
        Login
      </button>
    </form>

    <p>{{ name.value }}</p>
  </div>
</div>
